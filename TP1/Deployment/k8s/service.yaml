# Service : répartit les requêtes entre les pods de l'API.
#
# TP2 (WAF) : le Service n'a PLUS d'IP publique (ClusterIP). La seule entrée est
# l'Ingress (ingress.yaml), protégé par Cloud Armor : impossible de contourner
# le WAF en appelant directement l'ancienne IP.

apiVersion: v1
kind: Service
metadata:
  name: dss-api
  annotations:
    # le load balancer de l'Ingress envoie le trafic directement aux pods
    cloud.google.com/neg: '{"ingress": true}'
    # règles Cloud Armor + sonde de santé : voir BackendConfig dans ingress.yaml
    cloud.google.com/backend-config: '{"default": "dss-api"}'
spec:
  type: ClusterIP                  # interne au cluster
  selector:
    app: dss-api
  ports:
    - port: 80
      targetPort: 8080             # port de l'API dans le conteneur
