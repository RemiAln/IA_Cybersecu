# Deployment : décrit COMMENT faire tourner l'API dans le cluster GKE
# (quelle image, combien de copies, quelles ressources, comment vérifier qu'elle va bien).
#
# ⚠️ Remplacer MON_PROJET par l'ID du projet GCP dans la ligne "image".

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dss-api
  labels:
    app: dss-api
spec:
  replicas: 2                      # 2 copies de l'API : si l'une tombe, l'autre répond
  selector:
    matchLabels:
      app: dss-api
  template:
    metadata:
      labels:
        app: dss-api
    spec:
      # Sécurité (TP2, étape 5) : le pod tourne avec l'utilisateur non-root de
      # l'image (UID 10001) et le filtre d'appels système par défaut (seccomp).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp                      # seul dossier accessible en écriture
          emptyDir:
            sizeLimit: 1Gi
      containers:
        - name: api
          image: europe-west1-docker.pkg.dev/MON_PROJET/dss/api:v1
          securityContext:
            allowPrivilegeEscalation: false   # impossible de redevenir root
            readOnlyRootFilesystem: true      # impossible de modifier le code ou le modèle
            capabilities:
              drop: ["ALL"]                   # aucun privilège système
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080      # API (exposée par le Service)
            - name: metriques          # métriques Prometheus (étape 6) : PAS exposé
              containerPort: 9090      # par le Service, lu seulement dans le cluster
          # Secrets (étape 4) : clé API et sel des logs, lus dans le Secret
          # Kubernetes "dss-secrets" (créé à la main, JAMAIS écrit dans git)
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: dss-secrets
                  key: API_KEY
            - name: LOG_SALT
              valueFrom:
                secretKeyRef:
                  name: dss-secrets
                  key: LOG_SALT
          # Ressources réservées (requests) et maximum autorisé (limits) par copie.
          # Laya (~650 Mo sur disque, plus en mémoire une fois chargé) + PyTorch CPU.
          resources:
            requests:
              cpu: "1"             # 1 cœur : Laya est lourd en calcul
              memory: "3Gi"
            limits:
              memory: "4Gi"
          # startupProbe : laisse jusqu'à 5 min au pod pour charger Laya avant de
          # considérer qu'il a planté (30 essais x 10 s)
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          # readinessProbe : le pod ne reçoit du trafic qu'une fois le modèle chargé
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          # livenessProbe : si l'API ne répond plus, Kubernetes redémarre le pod
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
