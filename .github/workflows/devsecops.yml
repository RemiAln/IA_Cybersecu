# =============================================================================
# TP2 - Étape 5 : pipeline CI/CD de l'API Digital Social Score
#
# Pipeline de base (cours 4) : lint -> build -> push -> déploiement GKE
# Sécurité ajoutée (cours 5), repérée par [SÉCURITÉ] :
#   - scan des dépendances (pip-audit, équivalent de Safety CLI)
#   - recherche de secrets commités (gitleaks)
#   - Trivy : scan de la configuration (Dockerfile, k8s) puis de l'image, bloquant
#   - connexion à GCP sans clé JSON (Workload Identity) + compte au moindre privilège
#
# Variables GitHub (Settings > Secrets and variables > Actions > Variables) :
#   GCP_PROJECT_ID, MODELE_IMAGE (ex. api:v3), GCP_SA_DEPLOY, GCP_WIF_PROVIDER
# =============================================================================

name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# bash -eo pipefail : une commande qui échoue fait échouer l'étape, même avec "| tee"
defaults:
  run:
    shell: bash

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  # ===========================================================================
  # 1. CI : vérification du code, à chaque push et pull request
  # ===========================================================================
  verification:
    name: Vérification du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                 # tout l'historique, pour gitleaks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          pip install ruff==0.17.5
          ruff check --isolated --select E9,F --output-format=github TP1 TP2

      - name: "[SÉCURITÉ] Dépendances vulnérables (pip-audit)"
        # Mêmes dépendances que l'image Docker
        run: |
          python -m venv /tmp/api
          /tmp/api/bin/pip install -q torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/api/bin/pip install -q -r TP1/requirements-api.txt pip-audit
          /tmp/api/bin/pip install -q --upgrade pip setuptools
          /tmp/api/bin/pip-audit --desc

      - name: "[SÉCURITÉ] Secrets commités (gitleaks)"
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner

      - name: "[SÉCURITÉ] Configuration Docker et Kubernetes (Trivy)"
        # Dockerfile et manifestes k8s : conteneur en root, privilèges par défaut...
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --exit-code 1 --severity HIGH,CRITICAL TP1

  # ===========================================================================
  # 2. CD : build et déploiement, sur main uniquement, si la CI a réussi
  # ===========================================================================
  deploiement:
    name: Build et déploiement
    needs: verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                    # jeton temporaire pour la Workload Identity
    env:
      # Image taguée par le commit (cours 4 : $COMMIT_SHA)
      IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dss/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de la place sur le runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: "[SÉCURITÉ] Connexion à GCP sans clé JSON (Workload Identity)"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_DEPLOY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Récupérer le modèle Laya (depuis une image déjà publiée)
        # Le modèle (~650 Mo) n'est pas dans Git : on le copie depuis une image
        # existante d'Artifact Registry, qui le contient dans /app/modeles/laya.
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          SOURCE="europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/dss/${{ vars.MODELE_IMAGE }}"
          docker pull "$SOURCE"
          docker create --name source "$SOURCE"
          mkdir -p TP1/modeles
          docker cp source:/app/modeles/laya TP1/modeles/laya
          docker rm source
          docker rmi "$SOURCE"           # libère la place avant le build

      - name: Build de l'image
        run: docker build -f TP1/Deployment/Dockerfile -t "$IMAGE" TP1

      - name: "[SÉCURITÉ] Scan de l'image (Trivy, bloquant)"
        # Faille HIGH/CRITICAL corrigeable = échec : l'image n'est pas poussée.
        # Exceptions justifiées : fichier .trivyignore à la racine du dépôt.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE"

      - name: Push dans Artifact Registry
        run: docker push "$IMAGE"

      - name: Déploiement sur GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: dss-cluster
          location: europe-west1

      - name: Mise à jour de l'image et rollout
        run: |
          kubectl set image deployment/dss-api api="$IMAGE"
          kubectl rollout status deployment/dss-api --timeout=15m
